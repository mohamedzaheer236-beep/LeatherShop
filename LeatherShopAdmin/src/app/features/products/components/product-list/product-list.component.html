<p-confirmDialog></p-confirmDialog>

<div class="products-page">
  <p-toolbar styleClass="mb-4">
    <ng-template pTemplate="left">
      <h1 class="page-title">Products</h1>
    </ng-template>
    <ng-template pTemplate="right">
      <a routerLink="/products/new">
        <p-button label="Add Product" icon="pi pi-plus" severity="primary"></p-button>
      </a>
    </ng-template>
  </p-toolbar>

  <div class="filters-bar" [formGroup]="filterForm">
    <span class="p-input-icon-left">
      <i class="pi pi-search"></i>
      <input id="searchText" name="searchText" type="text" pInputText placeholder="Search products..." formControlName="searchText"
             (keyup.enter)="search()" aria-label="Search products" autocomplete="off" />
    </span>
    <p-dropdown #catDropdown [options]="categoryOptions" formControlName="filterCategory"
                inputId="filterCategory"
                placeholder="All Categories" [style]="{'min-width': '190px'}"
                [filter]="true" filterBy="label" [showClear]="true" appendTo="body"
                [resetFilterOnHide]="true"
                emptyFilterMessage="No results found"
                (onShow)="onDropdownShow(catDropdown, 'categoryFilter')">
      <ng-template pTemplate="filtericon">
        <i class="pi pi-times filter-clear-icon" (click)="clearDropdownFilter(catDropdown)"></i>
      </ng-template>
    </p-dropdown>
    <p-dropdown #brandDropdown [options]="brandOptions" formControlName="filterBrand"
                inputId="filterBrand"
                placeholder="All Brands" [style]="{'min-width': '190px'}"
                [filter]="true" filterBy="label" [showClear]="true" appendTo="body"
                [resetFilterOnHide]="true"
                emptyFilterMessage="No results found"
                (onShow)="onDropdownShow(brandDropdown, 'brandFilter')">
      <ng-template pTemplate="filtericon">
        <i class="pi pi-times filter-clear-icon" (click)="clearDropdownFilter(brandDropdown)"></i>
      </ng-template>
    </p-dropdown>
    <button pButton type="button" icon="pi pi-search"
            class="p-button-primary" (click)="search()"
            pTooltip="Search" tooltipPosition="top"></button>
    <button pButton type="button" icon="pi pi-refresh"
            class="p-button-secondary p-button-outlined" (click)="resetFilters()"
            pTooltip="Reset filters" tooltipPosition="top"></button>
  </div>

  <app-loading-spinner [loading]="loading" message="Loading products..."></app-loading-spinner>

  <p-table [value]="products" *ngIf="!loading && products.length > 0"
           [tableStyle]="{'min-width': '60rem'}" styleClass="p-datatable-striped"
           [rowHover]="true">
    <ng-template pTemplate="header">
      <tr>
        <th>Name</th>
        <th>Brand</th>
        <th>Category</th>
        <th>Price</th>
        <th>Stock</th>
        <th>Active</th>
        <th>Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-product>
      <tr [class.inactive-row]="!product.isActive">
        <td><strong>{{ product.name }}</strong></td>
        <td>{{ product.brand }}</td>
        <td>{{ product.category }}</td>
        <td>&#8377;{{ product.price | number:'1.0-0' }}</td>
        <td>
          <p-tag [value]="product.stockQuantity.toString()"
                 [severity]="product.stockQuantity <= 5 ? 'danger' : 'success'"></p-tag>
        </td>
        <td>
          <p-tag [value]="product.isActive ? 'Active' : 'Inactive'"
                 [severity]="product.isActive ? 'success' : 'secondary'"
                 [style]="{'cursor': 'pointer'}" role="button" tabindex="0"
                 [attr.aria-label]="(product.isActive ? 'Deactivate' : 'Activate') + ' ' + product.name"
                 (click)="toggleActive(product)"
                 (keydown.enter)="toggleActive(product)"
                 (keydown.space)="$event.preventDefault(); toggleActive(product)"></p-tag>
        </td>
        <td>
          <div class="action-buttons">
            <a [routerLink]="['/products/edit', product.id]">
              <p-button icon="pi pi-pencil" severity="info" [text]="true" [rounded]="true"
                        pTooltip="Edit" tooltipPosition="top"></p-button>
            </a>
            <p-button icon="pi pi-trash" severity="danger" [text]="true" [rounded]="true"
                      pTooltip="Delete" tooltipPosition="top"
                      (onClick)="deleteProduct(product)"></p-button>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td colspan="7" style="text-align:center; padding:40px; color:#999;">No products found. Add your first product!</td></tr>
    </ng-template>
  </p-table>

  <div *ngIf="!loading && products.length === 0" class="empty-state">
    <i class="pi pi-box"></i>
    <p>No products found. Add your first product!</p>
  </div>
</div>

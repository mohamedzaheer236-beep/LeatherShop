<p-confirmDialog></p-confirmDialog>

<div class="product-form-page">
  <h1 class="page-title" style="margin-bottom:24px;">{{ isEdit ? 'Edit Product' : 'Add New Product' }}</h1>

  <p-card>
    <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
      <div class="form-grid">
        <div class="form-field">
          <label for="name">Product Name *</label>
          <input id="name" type="text" pInputText formControlName="name"
                 placeholder="e.g. Classic Leather Wallet" class="w-full" />
          <small class="p-error" *ngIf="isFieldInvalid('name')">Product name is required.</small>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="brand">Brand *</label>
            <input id="brand" type="text" pInputText formControlName="brand"
                   placeholder="e.g. Royal Leather" class="w-full" />
            <small class="p-error" *ngIf="isFieldInvalid('brand')">Brand is required.</small>
          </div>
          <div class="form-field">
            <label for="category">Category *</label>
            <p-dropdown id="category" [options]="categoryOptions" formControlName="category"
                        placeholder="Select Category" [style]="{'width': '100%'}"></p-dropdown>
            <small class="p-error" *ngIf="isFieldInvalid('category')">Category is required.</small>
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="price">Price (INR) *</label>
            <p-inputNumber id="price" formControlName="price" mode="currency" currency="INR"
                          locale="en-IN" [min]="1" [style]="{'width': '100%'}" [inputStyle]="{'width': '100%'}"></p-inputNumber>
            <small class="p-error" *ngIf="isFieldInvalid('price')">Price must be at least ₹1.</small>
          </div>
          <div class="form-field">
            <label for="stock">Stock Quantity *</label>
            <p-inputNumber id="stock" formControlName="stockQuantity"
                          [min]="0" [showButtons]="true" [style]="{'width': '100%'}" [inputStyle]="{'width': '100%'}"></p-inputNumber>
            <small class="p-error" *ngIf="isFieldInvalid('stockQuantity')">Stock quantity is required.</small>
          </div>
        </div>

        <div class="form-field">
          <label for="imageUrl">Image URL</label>
          <input id="imageUrl" type="text" pInputText formControlName="imageUrl"
                 placeholder="https://example.com/image.jpg" class="w-full" />
        </div>

        <div class="form-field">
          <label for="description">Description</label>
          <textarea id="description" pInputTextarea formControlName="description"
                    rows="4" placeholder="Describe the product..." class="w-full" [autoResize]="true"></textarea>
        </div>
      </div>

      <div class="form-actions">
        <p-button label="Cancel" severity="secondary" [outlined]="true" routerLink="/products" icon="pi pi-times"></p-button>
        <p-button [label]="saving ? 'Saving...' : (isEdit ? 'Update Product' : 'Create Product')"
                  type="submit" icon="pi pi-check" [disabled]="saving" [loading]="saving"></p-button>
      </div>
    </form>
  </p-card>
</div>

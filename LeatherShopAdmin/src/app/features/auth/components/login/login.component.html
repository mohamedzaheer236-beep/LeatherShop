<div class="login-page">
  <!-- Spline 3D Background (loads after form) -->
  <iframe
    class="spline-bg"
    src="https://my.spline.design/interactiveaistartupheropage-s4MZKTFkESyL5jVYbgOLMYYB/"
    frameborder="0"
    loading="lazy">
  </iframe>

  <!-- Dark overlay for readability -->
  <div class="bg-overlay"></div>

  <!-- Glassmorphism Login Card -->
  <div class="glass-card">
    <!-- Brand header -->
    <div class="card-header">
      <div class="logo-ring">
        <i class="pi pi-lock"></i>
      </div>
      <h1 class="card-title">Leather Shop</h1>
      <p class="card-subtitle">Admin Portal</p>
    </div>

    <!-- Error message -->
    @if (errorMessage) {
      <div class="error-banner">
        <i class="pi pi-exclamation-triangle"></i>
        <span>{{ errorMessage }}</span>
      </div>
    }

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <!-- Username -->
      <div class="form-field">
        <label for="username">
          <i class="pi pi-user"></i>
          Username
        </label>
        <input pInputText
          id="username"
          formControlName="username"
          placeholder="Enter your username"
          [class.ng-invalid-visible]="f['username'].touched && f['username'].errors"
          autocomplete="username"/>
        @if (f['username'].touched && f['username'].errors?.['required']) {
          <small class="field-error">
            <i class="pi pi-info-circle"></i> Username is required
          </small>
        }
      </div>

      <!-- Password -->
      <div class="form-field">
        <label for="password">
          <i class="pi pi-key"></i>
          Password
        </label>
        <div class="password-wrapper">
          <input pInputText
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="Enter your password"
            [class.ng-invalid-visible]="f['password'].touched && f['password'].errors"
            autocomplete="current-password"/>
          <button type="button" class="toggle-password" (click)="togglePassword()">
            <i class="pi" [class.pi-eye-slash]="showPassword" [class.pi-eye]="!showPassword"></i>
          </button>
        </div>
        @if (f['password'].touched && f['password'].errors?.['required']) {
          <small class="field-error">
            <i class="pi pi-info-circle"></i> Password is required
          </small>
        }
      </div>

      <!-- Login button -->
      <button pButton
        type="submit"
        label="Sign In"
        icon="pi pi-sign-in"
        class="login-btn"
        [loading]="loading"
        [disabled]="loading">
      </button>
    </form>

    <div class="form-footer">
      <i class="pi pi-shield"></i>
      <span>Secure Admin Access</span>
    </div>
  </div>
</div>
